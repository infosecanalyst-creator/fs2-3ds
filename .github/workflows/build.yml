name: build-3dsx
# Builds fs2-3ds.3dsx with devkitARM and publishes it (with the build log) to the `builds`
# branch, so it can be tested in an emulator and installed over Wi-Fi without a local build.
on:
  push:
    branches: ["**", "!builds", "!builds-*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git make python3 ca-certificates >/dev/null
          dkp-pacman -Sy --noconfirm 3ds-dev 3ds-libogg 3ds-libpng 3ds-zlib >/dev/null || echo "devkitPro package server unavailable: using the image's packages"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Build
        run: . ./env.sh && make -k -j$(nproc) 2>&1 | tee build.log; test -f fs2-3ds.3dsx
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp fs2-3ds.3dsx build.log out/ 2>/dev/null || true
          echo "$GITHUB_SHA" > out/SOURCE_COMMIT
      - name: Publish to builds branch
        if: always()
        shell: bash
        run: |
          cd out
          git init -q -b builds
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -qm "build of ${GITHUB_SHA}"
          # main publishes to `builds` (what gets installed); other branches to builds-<branch>
          dest=builds; [ "$GITHUB_REF_NAME" = main ] || dest="builds-${GITHUB_REF_NAME//\//-}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "builds:$dest"
